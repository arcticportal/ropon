
services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile-backend

    volumes:
      - ..:/workspace
      - ../../storage:/srv/media

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # network_mode: service:db
    # networks:
    #   - backend
    env_file:
      - .env.local
    depends_on:
      - db
      # - redis
      
    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # networks:
    #   - backend
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  frontend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile-angular
    volumes:
      - ..:/workspace
    network_mode: service:db
    # networks:
    #   - backend
    env_file:
      - .env.local
    command: sleep infinity

  nginx-media:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile-nginx-media
    volumes:
      - ../../storage/:/usr/share/nginx/html/media:ro
    # networks:
    #   - backend
    # network_mode: service:db
    env_file:
      - .env.local

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # networks:
    #   - backend
    # network_mode: service:db

volumes:
  postgres-data:
  redis-data:

# networks:
#   backend:
