# PR gate + merge router: detects changed paths via dorny/paths-filter and runs
# only the relevant reusable workflows, then aggregates results into a single
# `gate` check. Require the `gate` job in your branch ruleset.
#
# Single source of truth for "what changed -> what runs":
#   - PR:        tests + combined smoke + build-only (no image pushes)
#   - push/merge: only the changed area's image build+push
# Child workflows are reusable-only (no standalone push/workflow_run triggers).
name: CI Gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so downstream jobs can skip themselves.
  # dorny/paths-filter handles pull_request/push/workflow_dispatch uniformly,
  # comparing against the PR base / previous branch tip / HEAD^ respectively.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      angular: ${{ steps.f.outputs.angular }}
      deploy: ${{ steps.f.outputs.deploy }}
      nginx_media: ${{ steps.f.outputs.nginx_media }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: f
        # Pinned to v3 HEAD for supply-chain safety (repo holds secrets).
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        with:
          # dorny falls back to repository.default_branch (= 'dev' here) when 'base'
          # is unset. On a push to 'main' that diffs dev...main, which is empty once dev
          # is merged into main, so no changes are detected and build jobs never run.
          # Force base = pushed branch on push so dorny diffs github.event.before..head
          # (PR runs ignore 'base' and use the PR file API, so this is push-only).
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            backend:
              - 'backend/**'
            angular:
              - 'angular/**'
            deploy:
              - 'deploy/frontend/**'
              - 'deploy/backend/**'
              - 'deploy/nginx-media/**'
              - 'deploy/docker-compose-test*'
            nginx_media:
              - 'deploy/nginx-media/**'

  # Backend changes on a PR -> run wagtail tests. Not re-run on merge (PR gated).
  backend-tests:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/wagtail-tests.yml

  # Frontend/backend/deploy changes on a PR -> combined health check.
  combined:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.angular == 'true' || needs.changes.outputs.deploy == 'true')
    uses: ./.github/workflows/combined-services-test.yml

  # Angular changes -> build-only on PR, build+push on merge.
  angular-build:
    needs: changes
    if: needs.changes.outputs.angular == 'true'
    uses: ./.github/workflows/angular-build.yml
    with:
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  # nginx-media changes -> build-only on PR, build+push on merge.
  nginx-media-build:
    needs: changes
    if: needs.changes.outputs.nginx_media == 'true'
    uses: ./.github/workflows/nginx-media-build.yml
    with:
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  # Backend changes -> build-only on PR, build+push on merge.
  wagtail-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/wagtail-dev-build.yml
    with:
      push: ${{ github.event_name == 'push' }}
    secrets: inherit

  # Single required check: green only if every job that ran passed.
  # Skipped jobs (path not changed) are ignored.
  gate:
    needs: [backend-tests, combined, angular-build, nginx-media-build, wagtail-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          for r in "${{ needs.backend-tests.result }}" "${{ needs.combined.result }}" "${{ needs.angular-build.result }}" "${{ needs.nginx-media-build.result }}" "${{ needs.wagtail-build.result }}"; do
            echo "result=$r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "blocked by a failed/cancelled job"
              exit 1
            fi
          done
          echo "gate passed"
