# PR gate: detects changed paths and runs only the relevant jobs,
# then aggregates their results into a single `gate` check.
# Require the `gate` job in your branch ruleset.
name: CI Gate

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so downstream jobs can skip themselves.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.r.outputs.backend }}
      angular: ${{ steps.r.outputs.angular }}
      deploy: ${{ steps.r.outputs.deploy }}
      nginx_media: ${{ steps.r.outputs.nginx_media }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: r
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # Fallback for workflow_dispatch (no PR base): compare to previous commit.
          [ -n "$BASE" ] || BASE="HEAD^"
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"
          echo "$changed"
          {
            printf 'backend=%s\n' "$(printf '%s\n' "$changed" | grep -q '^backend/' && echo true || echo false)"
            printf 'angular=%s\n' "$(printf '%s\n' "$changed" | grep -q '^angular/' && echo true || echo false)"
            printf 'deploy=%s\n' "$(printf '%s\n' "$changed" | grep -Eq '^deploy/(frontend|backend|nginx-media|docker-compose-test)' && echo true || echo false)"
            printf 'nginx_media=%s\n' "$(printf '%s\n' "$changed" | grep -q '^deploy/nginx-media/' && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # Backend changes -> run wagtail tests.
  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/wagtail-tests.yml

  # Angular changes -> verify the image builds (no push on PRs).
  angular-build:
    needs: changes
    if: needs.changes.outputs.angular == 'true'
    uses: ./.github/workflows/angular-build.yml

  # Frontend and/or backend and/or test compose changes -> combined health check.
  combined:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.angular == 'true' || needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/combined-services-test.yml

  # nginx-media changes -> verify the image builds (no push on PRs).
  nginx-media-build:
    needs: changes
    if: needs.changes.outputs.nginx_media == 'true'
    uses: ./.github/workflows/nginx-media-build.yml

  # Single required check: green only if every job that ran passed.
  # Skipped jobs (path not changed) are ignored.
  gate:
    needs: [backend-tests, angular-build, combined, nginx-media-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          for r in "${{ needs.backend-tests.result }}" "${{ needs.angular-build.result }}" "${{ needs.combined.result }}" "${{ needs.nginx-media-build.result }}"; do
            echo "result=$r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "blocked by a failed/cancelled job"
              exit 1
            fi
          done
          echo "gate passed"
