name: Combined Services Health Check
# Check the health of all services
# This workflow is triggered on push or pull request to main or dev branches
# It checks the health of the frontend and backend services
# and verifies that the admin page is accessible.
# It also checks the network connectivity to the frontend and backend services.
# The workflow is triggered by changes to the frontend and backend directories
# and the Docker Compose files.
# It uses the Docker Compose file for the test environment
# and runs the services in detached mode.
# The workflow includes steps to build the services, start them,
# and check their health.
# It also includes steps to stop the services and remove any orphaned containers.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'angular/**'
      - 'deploy/frontend/Dockerfile'
      - 'deploy/frontend/nginx.conf'
      - 'deploy/frontend/.env.test'
      - 'deploy/docker-compose-test.yml'
      - 'backend/**'
      - 'deploy/backend/.env.test'
      - '.github/workflows/combined-services-test.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'angular/**'
      - 'deploy/frontend/Dockerfile'
      - 'deploy/frontend/nginx.conf'
      - 'deploy/frontend/.env.test'
      - 'deploy/docker-compose-test.yml'
      - 'backend/**'
      - 'deploy/backend/.env.test'
      - '.github/workflows/combined-services-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel any in-progress runs of this workflow for the same branch
  # This is useful to avoid multiple builds for the same branch
  # and to save resources.
  cancel-in-progress: true

jobs:
  test-combined-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services (test environment)
        run: docker compose -f deploy/docker-compose-test.yml build

      # Pull any required images
      - name: Pull required images
        run: docker compose -f deploy/docker-compose-test.yml pull
    
      # Run initial setup for backend
      - name: Initial setup for backend
        run: docker compose -f deploy/docker-compose-test.yml run backend python manage.py init_setup
    
      - name: Start services (test environment)
        run: |
          docker compose -f deploy/docker-compose-test.yml up -d
          sleep 5
          echo "Container status after startup:"
          docker compose -f deploy/docker-compose-test.yml ps

      # Wait for service to be ready with retry logic
      - name: Wait for service to be ready
        run: |
          echo "Waiting for Wagtail to start..."
          # Wait with retry logic (timeout after 1 minute)
          timeout=60
          counter=0
          interval=5
          until $(curl -sL --output /dev/null --fail http://localhost:8000/admin/); do
            if [ $counter -eq $timeout ]; then
              echo "ERROR: Timed out waiting for Wagtail to start"
              exit 1
            fi
            echo "Waiting for Wagtail to be available... ($counter seconds elapsed)"
            sleep $interval
            counter=$((counter+interval))
          done
          echo "Wagtail admin is now accessible!"
     
      # Use curl to test if the admin page loads correctly
      - name: Check network connectivity
        run: |
            # Check if port 8000 is accessible at network level
            echo "Checking network connectivity to port 8000..."
            PORT_8000_REACHABLE=true
            if nc -z localhost 8000; then
              echo "Port 8000 is reachable"
            else
              echo "Error: Cannot connect to port 8000 on localhost"
              PORT_8000_REACHABLE=false
            fi
            
            # Check if port 4200 is accessible at network level
            echo "Checking network connectivity to port 4200..."
            PORT_4200_REACHABLE=true
            if nc -z localhost 4200; then
              echo "Port 4200 is reachable"
            else
              echo "Error: Cannot connect to port 4200 on localhost"
              PORT_4200_REACHABLE=false
            fi
            

      - name: Test backend admin page
        run: |
          # Store curl output in a file to avoid potential issues with variable capture
          curl -sL --retry 3 --retry-delay 5 http://localhost:8000/admin/ > response.html
          echo "Received response from admin page"
          
          # Check if the response contains the expected string
          if grep -q "Sign in to RoPON Dashboard" response.html; then
            echo "Success: Admin page contains expected login text"
          else
            echo "Error: Admin page does not contain expected login text"
            echo "Response content:"
            cat response.html
            exit 1
          fi

      - name: Wait for services and check frontend health
        run: |
          echo "Waiting for services to start..."
          echo "Checking frontend health (http://localhost:4200)..."
          curl --fail --retry 10 --retry-delay 5 --max-time 10 http://localhost:4200
          echo "Frontend is healthy!"
     
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "Attempting to retrieve Docker logs due to failure..."
          echo "Docker logs for frontend service:"
          docker compose -f deploy/docker-compose-test.yml logs frontend || echo "Failed to get frontend logs."
          echo "Docker logs for backend service:"
          docker compose -f deploy/docker-compose-test.yml logs backend || echo "Failed to get backend logs."
          echo "Docker logs for db service:"
          docker compose -f deploy/docker-compose-test.yml logs db || echo "Failed to get db logs."

      - name: Stop services
        if: always() # Ensures services are stopped even if previous steps fail
        run: docker compose -f deploy/docker-compose-test.yml down -v --remove-orphans
