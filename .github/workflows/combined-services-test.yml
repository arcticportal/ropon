name: Combined Services Health Check

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-combined-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services (dev environment)
        run: docker compose -f deploy/docker-compose-dev.yml build

      - name: Start services (dev environment)
        run: docker compose -f deploy/docker-compose-dev.yml up -d

      - name: Check backend health
        run: |
          echo "Checking backend health (http://localhost:8000/api/v2/)..."
          # Accessing the root of the Wagtail API v2, which should list available endpoints.
          curl --fail --retry 10 --retry-delay 15 --max-time 10 http://localhost:8000/api/v2/
        # Increased retries and delay.
      
      - name: Wait for services and check frontend health
        run: |
         echo "Waiting for services to start..."
         sleep 30 # Initial wait for services to come up
         echo "Checking frontend health (http://localhost:4200)..."
         curl --fail --retry 10 --retry-delay 15 --max-time 10 http://localhost:4200
        # Increased retries and delay to allow services ample time to initialize.

     
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "Attempting to retrieve Docker logs due to failure..."
          echo "Docker logs for frontend service:"
          docker compose -f deploy/docker-compose-dev.yml logs frontend || echo "Failed to get frontend logs."
          echo "Docker logs for backend service:"
          docker compose -f deploy/docker-compose-dev.yml logs backend || echo "Failed to get backend logs."
          echo "Docker logs for db service:"
          docker compose -f deploy/docker-compose-dev.yml logs db || echo "Failed to get db logs."

      - name: Stop services
        if: always() # Ensures services are stopped even if previous steps fail
        run: docker compose -f deploy/docker-compose-dev.yml down
