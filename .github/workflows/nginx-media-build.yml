# .github/workflows/nginx-media-build.yml
name: Nginx Media Docker Build and Push

# Reusable: called by .github/workflows/ci.yml. Build-only when push=false
# (PRs), build+push to ACR when push=true (merges to main/dev, manual dispatch).
on:
  workflow_call:
    inputs:
      push:
        description: 'Push the built image to ACR'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to ACR'
        type: boolean
        default: false

permissions:
  contents: read

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   # Cancel any in-progress runs of this workflow for the same branch
#   cancel-in-progress: true

jobs:
  build_and_push_nginx_media_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        # Only login when asked to push (merges / manual dispatch). On PRs we only build.
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: arcticportal.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: arcticportal.azurecr.io/ropon/nginx-media
          tags: |
            type=raw,value=${{ github.ref_name }}-{{date 'YYYY-MM-DD'}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'dev' }}

      - name: Build and push Nginx Media Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/nginx-media
          file: ./deploy/nginx-media/Dockerfile
          push: ${{ inputs.push }} # Only push on merge to main/dev or manual dispatch
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max