name: Test Wagtail Docker Compose Setup

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - backend/**
      - deploy/backend/**
      - .github/workflows/**
  push:
    paths:
      - backend/**
      - deploy/backend/**
      - .github/workflows/**
    branches:
      - dev
      - main

  workflow_dispatch:

jobs:
  test_wagtail_container:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Build the containers using docker-compose
      - name: Build container
        run: docker compose -f deploy/backend/docker-compose-test.yml build
      
      # Pull any required images
      - name: Pull required images
        run: docker compose -f deploy/backend/docker-compose-test.yml pull
      
      # Run initial setup
      - name: Initial setup
        run: docker compose -f deploy/backend/docker-compose-test.yml run wagtail python manage.py init_setup
      
      # Start the containers in detached mode
      - name: Start wagtail service
        run: docker compose -f deploy/backend/docker-compose-test.yml up -d
      
      # Wait for service to be ready
      - name: Wait for service to be ready
        run: |
          echo "Waiting for Wagtail to start..."
          sleep 20
      
      # Use curl to test if the admin page loads correctly
      - name: Test admin page
        run: |
          response=$(curl -s http://localhost:8000/admin/)
          echo "Received response from admin page"
          
          # Check if the response contains the expected string
          if echo "$response" | grep -q "Sign in to RoPON Dashboard"; then
            echo "Success: Admin page contains expected login text"
            exit 0
          else
            echo "Error: Admin page does not contain expected login text"
            echo "Response content:"
            echo "$response"
            exit 1
          fi
      
      # Stop the containers
      - name: Stop containers
        run: docker compose -f deploy/backend/docker-compose-test.yml down