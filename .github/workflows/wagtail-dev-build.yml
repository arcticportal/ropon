name: Build and Push Wagtail Docker Image
on:
  workflow_run:
    workflows: ["Run Wagtail Tests"]
    types:
      - completed
    branches:
      - dev
      - main

jobs:
  debug-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Debug workflow context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
          WORKFLOW_CONTEXT: ${{ toJSON(github.event.workflow_run) }}
        run: |
          echo "GitHub Context:"
          echo "$GITHUB_CONTEXT"
          echo "Workflow Run Context:"
          echo "$WORKFLOW_CONTEXT"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Event Type: ${{ github.event.workflow_run.event }}"
          


  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: arcticportal.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: arcticportal.azurecr.io/ropon/wagtail
          tags: |
            type=raw,value=${{ github.ref_name }}-{{date 'YYYY-MM-DD'}}
            type=ref,event=branch
              
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.workflow_run.updated_at }}
            org.opencontainers.image.branch=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
