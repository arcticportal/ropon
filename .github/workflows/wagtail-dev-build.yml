name: Build and Push Wagtail Docker Image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel any in-progress runs of this workflow for the same branch
  # This is useful to avoid multiple builds for the same branch
  # and to save resources.
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["Run Wagtail Tests"]
    types:
      - completed
    branches:
      - dev
      - main

jobs:
  debug-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Debug workflow context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
          WORKFLOW_CONTEXT: ${{ toJSON(github.event.workflow_run) }}
        run: |
          echo "GitHub Context:"
          echo "$GITHUB_CONTEXT"
          echo "Workflow Run Context:"
          echo "$WORKFLOW_CONTEXT"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Event Type: ${{ github.event.workflow_run.event }}"
          


  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    runs-on: ubuntu-latest

    steps:
      - name: Get branch name from triggering workflow
        id: branch
        run: |
          # Extract the branch name from the triggering workflow
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Triggering workflow ran on branch: ${BRANCH_NAME}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Checkout the specific branch that triggered the workflow
          ref: ${{ steps.branch.outputs.branch_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: arcticportal.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: arcticportal.azurecr.io/ropon/wagtail
          tags: |
            type=raw,value=${{ steps.branch.outputs.branch_name }}-{{date 'YYYY-MM-DD'}}
            type=raw,value=${{ steps.branch.outputs.branch_name }}
            type=raw,value=latest,enable=${{ steps.branch.outputs.branch_name == 'main' }}
            type=raw,value=${{ steps.branch.outputs.branch_name }}-latest,enable=${{ steps.branch.outputs.branch_name == 'main' || steps.branch.outputs.branch_name == 'dev' }}

          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.created=${{ github.event.workflow_run.updated_at }}
            org.opencontainers.image.branch=${{ steps.branch.outputs.branch_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
