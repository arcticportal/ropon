  # test compose file setup for wagtail
  test_wagtail_container:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Build the containers using docker-compose
      - name: Build container
        run: docker compose -f deploy/backend/docker-compose-test.yml build
      
      # Pull any required images
      - name: Pull required images
        run: docker compose -f deploy/backend/docker-compose-test.yml pull
      
      # Run initial setup
      - name: Initial setup
        run: docker compose -f deploy/backend/docker-compose-test.yml run wagtail python manage.py init_setup
      
      # Start the containers in detached mode
      - name: Start wagtail service
        run: |
          docker compose -f deploy/backend/docker-compose-test.yml up -d
          sleep 5
          echo "Container status after startup:"
          docker compose -f deploy/backend/docker-compose-test.yml ps
      
      # Display container logs for debugging
      - name: Display container logs
        run: |
          echo "Displaying Wagtail container logs:"
          docker compose -f deploy/backend/docker-compose-test.yml logs wagtail
          echo "Checking container health:"
          docker compose -f deploy/backend/docker-compose-test.yml ps wagtail
      # Wait for service to be ready with retry logic
      - name: Wait for service to be ready
        run: |
          echo "Waiting for Wagtail to start..."
          # Wait with retry logic (timeout after 2 minutes)
          timeout=120
          counter=0
          until $(curl -sL --output /dev/null --fail http://localhost:8000/admin/); do
            if [ $counter -eq $timeout ]; then
              echo "ERROR: Timed out waiting for Wagtail to start"
              docker compose -f deploy/backend/docker-compose-test.yml logs wagtail
              exit 1
            fi
            echo "Waiting for Wagtail to be available... ($counter seconds elapsed)"
            sleep 5
            counter=$((counter+5))
          done
          echo "Wagtail admin is now accessible!"
      
      # Use curl to test if the admin page loads correctly
      - name: Test admin page
        run: |
          # Store curl output in a file to avoid potential issues with variable capture
          curl -sL --retry 3 --retry-delay 5 http://localhost:8000/admin/ > response.html
          echo "Received response from admin page"
            # Check if port 8000 is accessible at network level
            echo "Checking network connectivity to port 8000..."
            if nc -z localhost 8000; then
            echo "Port 8000 is reachable"
            else
            echo "Error: Cannot connect to port 8000 on localhost"
            echo "Checking container status:"
            docker compose -f deploy/backend/docker-compose-test.yml ps
            echo "Checking container logs:"
            docker compose -f deploy/backend/docker-compose-test.yml logs wagtail
            exit 1
            fi
            
            # Check if the response contains the expected string
            if grep -q "Sign in to RoPON Dashboard" response.html; then
            echo "Success: Admin page contains expected login text"
            exit 0
            else
            echo "Error: Admin page does not contain expected login text"
            echo "Response content:"
            cat response.html
            exit 1
            fi
          
      # Stop the containers
      - name: Stop containers
        run: docker compose -f deploy/backend/docker-compose-test.yml down