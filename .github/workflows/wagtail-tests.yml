name: Run Wagtail Tests

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - backend/**
      - deploy/backend/**
      - .github/workflows/wagtail-tests.yml
  push:
    paths:
      - backend/**
      - deploy/backend/**
      - .github/workflows/wagtail-tests.yml
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_environment:
    runs-on: ubuntu-latest
    outputs:
      # Define an output for the artifact name to ensure uniqueness if needed
      db_artifact_name: db_backup_${{ github.run_id }}_${{ github.run_attempt }}
      wagtail_image_artifact_name: wagtail_image
      wagtail_image_path: ${{ runner.temp }}/wagtail_image.tar
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export wagtail image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/backend/Dockerfile
          push: false
          tags: wagtail_image:local
          outputs: type=docker,dest= ${{ steps.prepare_environment.outputs.wagtail_image_path }}
        
      - name: Upload Wagtail image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_environment.outputs.wagtail_image_artifact_name }}
          path: ${{ steps.prepare_environment.outputs.wagtail_image_path }}

      - name: Pull database image
        run: docker compose -f deploy/backend/docker-compose-test.yml pull

      - name: Run initial setup (populates DB)
        run: docker compose -f deploy/backend/docker-compose-test.yml run --rm wagtail python manage.py init_setup

      - name: Stop database service
        run: docker compose -f deploy/backend/docker-compose-test.yml stop db

      - name: Create database backup
        run: |
          # !!! IMPORTANT: Replace 'ropon_explicit_test_db_volume' with the actual Docker volume name !!!
          # This name MUST match the 'name:' field under 'volumes:' in your docker-compose-test.yml
          # or be the auto-generated name if you don't explicitly name it.
          DB_VOLUME_NAME="ropon_postgres_data" # <--- VERIFY AND UPDATE THIS
          echo "Backing up Docker volume: ${DB_VOLUME_NAME}"
          mkdir -p db_artifact_dir # Create a directory for the artifact
          # Use an alpine container to create the tarball from the volume
          docker run --rm -v "${DB_VOLUME_NAME}:/volume_data_to_backup" -v "$(pwd)/db_artifact_dir:/backup_output" alpine \
            tar czf /backup_output/db_backup.tar.gz -C /volume_data_to_backup .
          echo "Database backup created in db_artifact_dir/db_backup.tar.gz"

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_environment.outputs.db_artifact_name || format('db_backup_{0}_{1}', github.run_id, github.run_attempt) }}
          path: db_artifact_dir/db_backup.tar.gz

      - name: Clean up Docker environment
        if: always()
        run: docker compose -f deploy/backend/docker-compose-test.yml down -v --remove-orphans

  run_app_tests:
    runs-on: ubuntu-latest
    needs: prepare_environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download database artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare_environment.outputs.db_artifact_name }}
          path: db_artifact_dir # Download to this directory

      - name: Create Docker volume for DB
        run: |
          # !!! IMPORTANT: Replace 'ropon_explicit_test_db_volume' with the actual Docker volume name !!!
          DB_VOLUME_NAME="ropon_postgres_data" # <--- VERIFY AND UPDATE THIS
          # Create the volume explicitly. 'docker compose up' would also create it if not present.
          docker volume create "${DB_VOLUME_NAME}" || echo "Volume '${DB_VOLUME_NAME}' already exists or failed to create (which might be ok if it exists)."

      - name: Restore database backup
        run: |
          # !!! IMPORTANT: Replace 'ropon_explicit_test_db_volume' with the actual Docker volume name !!!
          DB_VOLUME_NAME="ropon_postgres_data" # <--- VERIFY AND UPDATE THIS
          echo "Restoring database to Docker volume: ${DB_VOLUME_NAME}"
          # Use an alpine container to extract the tarball into the volume
          docker run --rm -v "${DB_VOLUME_NAME}:/volume_data_to_restore" -v "$(pwd)/db_artifact_dir:/backup_input" alpine \
            tar xzf /backup_input/db_backup.tar.gz -C /volume_data_to_restore
          echo "Database restored."

      - name: Download Wagtail image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare_environment.outputs.wagtail_image_artifact_name }}
          path: ${{ runner.temp }}

      - name: Load Wagtail image artifact
        run: |
          # Load the Wagtail image from the artifact
          docker load -i ${{ needs.prepare_environment.outputs.wagtail_image_path }}
          docker image ls 
          echo "Wagtail image loaded."
          
      
      - name: Pull DB image (should be cached)
        run: docker compose -f deploy/backend/docker-compose-test.yml pull

      # init_setup is NOT run here as the database is restored from artifact

      - name: Run Wagtail tests
        run: docker compose -f deploy/backend/docker-compose-test.yml run --rm wagtail python manage.py test

      - name: Stop and remove containers
        if: always()
        run: docker compose -f deploy/backend/docker-compose-test.yml down -v --remove-orphans

  test_container_deployment:
    runs-on: ubuntu-latest
    needs: prepare_environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl net-tools

      - name: Download database artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare_environment.outputs.db_artifact_name }}
          path: db_artifact_dir

      - name: Create Docker volume for DB
        run: |
          # !!! IMPORTANT: Replace 'ropon_explicit_test_db_volume' with the actual Docker volume name !!!
          DB_VOLUME_NAME="ropon_postgres_data" # <--- VERIFY AND UPDATE THIS
          docker volume create "${DB_VOLUME_NAME}" || echo "Volume '${DB_VOLUME_NAME}' already exists or failed to create."

      - name: Restore database backup
        run: |
          # !!! IMPORTANT: Replace 'ropon_explicit_test_db_volume' with the actual Docker volume name !!!
          DB_VOLUME_NAME="ropon_postgres_data" # <--- VERIFY AND UPDATE THIS
          docker run --rm -v "${DB_VOLUME_NAME}:/volume_data_to_restore" -v "$(pwd)/db_artifact_dir:/backup_input" alpine \
            tar xzf /backup_input/db_backup.tar.gz -C /volume_data_to_restore

      - name: Download Wagtail image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare_environment.outputs.wagtail_image_artifact_name }}
          path: ${{ runner.temp }}

      - name: Load Wagtail image artifact
        run: |
          # Load the Wagtail image from the artifact
          docker load -i ${{ needs.prepare_environment.outputs.wagtail_image_path }}
          docker image ls 
          echo "Wagtail image loaded."
     
      - name: Pull required images (should be cached)
        run: docker compose -f deploy/backend/docker-compose-test.yml pull

      # init_setup is NOT run here

      - name: Start services in detached mode
        run: |
          docker compose -f deploy/backend/docker-compose-test.yml up -d
          echo "Waiting for services to stabilize..."
          sleep 5 # Increased sleep after all services up
          echo "Container status after startup:"
          docker compose -f deploy/backend/docker-compose-test.yml ps

      - name: Display initial container logs
        run: |
          echo "Displaying Wagtail container logs (last 100 lines):"
          docker compose -f deploy/backend/docker-compose-test.yml logs --tail="100" wagtail || echo "Failed to get wagtail logs."
          echo "Displaying DB container logs (last 100 lines):"
          docker compose -f deploy/backend/docker-compose-test.yml logs --tail="100" db || echo "Failed to get db logs."

      - name: Wait for Wagtail service to be ready
        run: |
          echo "Waiting for Wagtail to start..."
          timeout=60
          counter=0
          interval=5
          until curl -sL --output /dev/null --fail http://localhost:8000/admin/; do
            if [ $counter -ge $timeout ]; then
              echo "ERROR: Timed out waiting for Wagtail to start after $counter seconds"
              exit 1
            fi
            echo "Waiting for Wagtail to be available... ($counter seconds elapsed, next check in $interval s)"
            sleep $interval
            counter=$((counter + interval))
          done
          echo "Wagtail admin is now accessible!"

      - name: Check network connectivity and test admin page
        run: |
          echo "Checking network connectivity to port 8000..."
          if nc -z localhost 8000; then
            echo "Port 8000 is reachable."
          else
            echo "Error: Cannot connect to port 8000 on localhost."
            exit 1
          fi

      - name: Test admin page
        run: |
          # Store curl output in a file to avoid potential issues with variable capture
          curl -sL --retry 3 --retry-delay 5 http://localhost:8000/admin/ > response.html
          echo "Received response from admin page"
          
          # Check if the response contains the expected string
          if grep -q "Sign in to RoPON Dashboard" response.html; then
            echo "Success: Admin page contains expected login text"
          else
            echo "Error: Admin page does not contain expected login text"
            echo "Response content:"
            cat response.html
            exit 1
          fi

      - name: Show Docker logs on job failure
        if: failure()
        run: |
          echo "Attempting to retrieve Docker logs due to job failure..."
          echo "Docker logs for wagtail service:"
          docker compose -f deploy/backend/docker-compose-test.yml logs wagtail || echo "Failed to get wagtail logs."
          echo "Docker logs for db service:"
          docker compose -f deploy/backend/docker-compose-test.yml logs db || echo "Failed to get db logs."

      - name: Stop and remove containers
        if: always()
        run: docker compose -f deploy/backend/docker-compose-test.yml down -v --remove-orphans