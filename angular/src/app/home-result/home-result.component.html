<div class="row">
  <div *ngFor="let network of networks" class="col-12 mt-3">
    <div class="card shadow-sm">
      <div class="row g-0">
	<div class="col-12 col-sm-2 pt-2 pt-sm-0 ps-2 pe-2 pe-sm-0 d-flex justify-content-center align-items-center">
	  <img class="img-fluid rounded-start"
	       [src]="util.formatImg(network.logo_url)" />
	</div>
	<div class="col">
	  <div class="card-body">
	    <h4 class="card-title">
	      <a [routerLink]="['/networks', network.ropon_id]">{{
		network.name}}</a>
	    </h4>
	    <div class="underline"></div>
	    <!--<div class="row">
	      <div class="col-sm-1">Asset Types</div>
	      <div class="col-sm-11">Foo</div>
	    </div>-->
	    <dl class="mb-0">
	      <span class="d-flex">
		<dt>Regions</dt>
		<dd class="region ms-2">{{
		  network.regions.join(', ')}}</dd>
	      </span>
	      <span class="d-flex">
		<dt>Subregions</dt>
		<dd class="region ms-2">{{
		  network.subregions.join(', ')}}</dd>
	      </span>
	      <span class="d-flex">
		<dt>Domains</dt>
		<dd class="domain">
		  <span *ngFor="let domain of network.domains"
			class="badge me-1">{{domain}}</span>
		</dd>
	      </span>
	      <span class="d-flex">
		<dt>Disciplines</dt>
		<dd class="discipline">
		  <span *ngFor="let discipline of network.disciplines"
			class="badge me-1">{{discipline}}</span>
		</dd>
	      </span>
	      <span class="d-flex">
		<dt>Asset Types</dt>
		<dd class="asset-type">
		  <span *ngFor="let assetType of network.asset_types"
			class="badge me-1">{{assetType}}</span>
		</dd>
	      </span>
	      <span class="d-flex">
		<dt>Website</dt>
		<dd class="ms-2 mb-0">
		  <a [href]="network.website_url" target="_blank">{{
		    util.formatUrl(network.website_url)}}</a>
		</dd>
	      </span>
	    </dl>
