
services:
  wagtail:
    build:
      context: ../../
      dockerfile: deploy/backend/Dockerfile
    command: ./docker-entrypoint.sh
    env_file:
      - .env.test

    depends_on:
      - db

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file:
      - .env.test
    volumes:
      - postgres-data:/var/lib/postgresql/data
  

volumes:
  postgres-data: