#meta information
apiVersion: v1.0
kind: deploy

# Used to build COMPOSE_PROJECT_NAME
# (app_name or github_repo) + ( instance_type or github_branch)
app_name: ropon
instance_type: prd # test or staging or production e.g.
github_repo: "ropon"
github_branch: "main"

# external facing domains configuration. Internal services must be configured using 
# service names and ports
service_ingres:
  backend:
    hostname: dashboard.polarobservingregistry.org
    ssl_host: dashboard.polarobservingregistry.org
    port: 8000
  frontend:
    hostname: polarobservingregistry.org,www.polarobservingregistry.org
    ssl_host: polarobservingregistry.org,www.polarobservingregistry.org
    port: 80
  nginx-media:
    hostname: media.polarobservingregistry.org
    ssl_host: media.polarobservingregistry.org
    port: 80

secrets:
  - name: DB_PASSWORD
    valueFrom:
      cntb:
        type: password
        id : 93050
  - name: ACR_APP_TOKEN
    valueFrom: 
      cntb:
        type: ssh
        id : 93287