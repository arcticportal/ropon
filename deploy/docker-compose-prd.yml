# /workspace/deploy/docker-compose-prd.yml

services:
  frontend:
    image: arcticportal.azurecr.io/ropon/frontend:latest # Production image
    restart: unless-stopped
    environment:
      - ANGULAR_ENV=${ANGULAR_ENV:-production} # just a placeholder


  backend:
    image: arcticportal.azurecr.io/ropon/wagtail:latest
    restart: unless-stopped
    command: ./docker-entrypoint.sh
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - WAGTAILADMIN_BASE_URL=${WAGTAILADMIN_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - WAGTAILAPI_LIMIT_MAX=${WAGTAILAPI_LIMIT_MAX:-none}
      - ROPON_ADMIN_EMAIL=${ROPON_ADMIN_EMAIL}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - MEDIA_ROOT=${MEDIA_ROOT}
      - DJANGO_PORT=${DJANGO_PORT:-8000}
      - GUNICORN_PORT=${GUNICORN_PORT:-8000}
      - GUNICORN_WORKERS_PER_CORE=${GUNICORN_WORKERS_PER_CORE:-}
      - GUNICORN_MAX_WORKERS=${GUNICORN_MAX_WORKERS:-}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-}
      - GUNICORN_GRACEFUL_TIMEOUT=${GUNICORN_GRACEFUL_TIMEOUT:-}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-}
      - GUNICORN_LOG_LEVEL=${GUNICORN_LOG_LEVEL:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_PORT=${EMAIL_PORT:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    networks:
      - backend
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

networks:
  backend:
